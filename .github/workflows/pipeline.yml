name: Data pipeline and deploy

# Each job is an agent with a contract (docs/04-agenti.md):
#   ingest -> audit-raw (gate) -> forecast -> audit-output (gate) -> publish -> deploy
# Any failure opens or updates an Issue labelled `data-audit-failed`; the live site stays on the
# last good version. Free plan: GitHub Pages needs a PUBLIC repo, so `deploy` is skipped on private ones.

on:
  schedule:
    - cron: '30 17 * * 1-5' # after Borsa Italiana closes (17:30 UTC = 18:30 CET in winter, 19:30 CEST in summer)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'pipeline/**'
      - 'data/**'
      - 'tools/**'
      - '.github/workflows/pipeline.yml'

permissions:
  contents: read

concurrency:
  group: pipeline
  cancel-in-progress: false

env:
  PYTHONPATH: pipeline

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Does the history branch exist yet?
        id: history
        run: |
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi

      - name: Restore price history (branch data)
        if: steps.history.outputs.exists == 'true'
        uses: actions/checkout@v4
        with:
          ref: data
          path: store
          fetch-depth: 1

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt

      - name: Ingest prices and FX
        run: python -m fd_pipeline ingest --provider yahoo --store store

      - name: Drop git metadata (a single path keeps the artifact root at store/)
        run: rm -rf store/.git

      - uses: actions/upload-artifact@v4
        with:
          name: store
          path: store
          retention-days: 3

  audit-raw:
    needs: ingest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: store
          path: store
      - name: Audit raw data (blocks on errors)
        run: python -m fd_pipeline audit --stage raw --store store --out build/site
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-raw
          path: build/site
          retention-days: 3

  forecast:
    needs: audit-raw
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: store
          path: store
      - uses: actions/download-artifact@v4
        with:
          name: site-raw
          path: build/site
      - name: Signals, scenario cones, calibration
        run: python -m fd_pipeline forecast --store store --out build/site
      - uses: actions/upload-artifact@v4
        with:
          name: site-forecast
          path: build/site
          retention-days: 3

  audit-output:
    needs: forecast
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: store
          path: store
      - uses: actions/download-artifact@v4
        with:
          name: site-forecast
          path: build/site
      - name: Audit outputs (blocks on errors)
        run: python -m fd_pipeline audit --stage output --store store --out build/site
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-audited
          path: build/site
          retention-days: 3

  publish:
    needs: audit-output
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # update the `data` branch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: store
          path: store
      - uses: actions/download-artifact@v4
        with:
          name: site-audited
          path: build/site

      - name: Manifest and final audit
        run: python -m fd_pipeline publish --store store --out build/site

      - name: Never publish synthetic data
        run: |
          grep -q '"data_source": "yahoo"' build/site/data/manifest.json

      - name: Assemble the site
        run: python tools/build_site.py

      - name: Save the price history on branch data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch --depth=1 origin data
            git worktree add history FETCH_HEAD
            git -C history checkout -B data
          else
            git worktree add --orphan -b data history
          fi
          rsync -a --delete --exclude='.git' store/ history/
          git -C history add -A
          if git -C history diff --cached --quiet; then
            echo "history unchanged"
          else
            git -C history commit -m "data: update prices $(date -u +%Y-%m-%d)"
            git -C history push origin data
          fi

      - uses: actions/upload-pages-artifact@v3
        if: ${{ !github.event.repository.private }}
        with:
          path: build/site

  deploy:
    needs: publish
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  report-failure:
    needs: [ingest, audit-raw, forecast, audit-output, publish, deploy]
    if: ${{ always() && contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const label = 'data-audit-failed';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const failed = Object.entries(${{ toJSON(needs) }})
              .filter(([, job]) => job.result === 'failure')
              .map(([name]) => name);
            const body = `La pipeline dati è fallita nei passi: **${failed.join(', ')}**.\n\nIl sito online resta all'ultima versione valida.\nDettagli e report dell'auditor negli artifact: ${run}`;
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, labels: label, state: 'open', per_page: 1,
            });
            if (open.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: open[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: 'Pipeline dati fallita', body, labels: [label],
              });
            }
