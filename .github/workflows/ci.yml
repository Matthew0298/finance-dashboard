name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: pipeline
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install Python dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Privacy guard (public repo, so no personal data and no secrets)
        run: python tools/privacy_guard.py

      - name: Pipeline tests
        run: python -m unittest discover -s pipeline/tests -t pipeline -v

      - name: Web tests
        run: node --test "web/js/*.test.mjs"

      # The auditor gates this: if the rules were not re-verified for a year (or anything else is
      # wrong) the run fails here, which is the intended reminder.
      - name: End-to-end on synthetic data (the audit must not fail)
        run: |
          python -m fd_pipeline run --provider synthetic --store build/store --out build/site
          python tools/build_site.py

      - name: The site must not reference third-party hosts
        run: |
          if grep -rEn "(src|href)=[\"']https?://|url\(https?://|@import" build/site --include=*.html --include=*.js --include=*.css; then
            echo "third-party reference found: the page must load everything from its own origin (ADR-0001)"; exit 1
          fi
